name: "vimjail"

hostname: "vimjail"
mode: ONCE
cwd: "/home/user"

time_limit: 600
daemon: false
max_cpus: 1

silent: false
skip_setsid: true

mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
    rw: false
}

mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}

mount {
    src: "/sbin"
    dst: "/sbin"
    is_bind: true
    rw: false
}

mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
}

mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
}

mount {
    src: "/home"
    dst: "/home"
    is_bind: true
    rw: false
}

mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    rw: false
}

mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: false
}

mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
    is_bind: false
    noexec: false
    nodev: true
    nosuid: true
}

exec_bin {
    path: "/bin/sh"
    arg0: "sh"
    arg: "-c"
    arg: "/home/user/run.sh"
}

{% extends "layout.html" %}
 
{% block content %}
 
  <p class="title is-1" style="text-align: center;">Login</p>

    <form method="post">

        <div class="field">
            <label class="label">Username</label>
            <div class="control has-icons-left has-icons-right">
              <input class="input is-success" type="text" placeholder="Username" name="username">
              <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
              </span>
            </div>
          </div>

          <div class="field">
            <label class="label">Password</label>
            <p class="control has-icons-left">
              <input class="input" type="password" placeholder="Password" name="password">
              <span class="icon is-small is-left">
                <i class="fas fa-lock"></i>
              </span>
            </p>
          </div>
          <div class="field">
            <p class="control">
              <button type="submit" class="button is-success">
                Login
              </button>
            </p>
          </div>

            {% if error %}
            <div class="notification is-danger is-light">
            <strong>{{ error }}</strong>
            </div>
            {% endif %}
    </form>

    You are not Register ? <a href="/register">register</a>.
    <p>Forgot password ? <a href="/forgotpass">Reset password</a>
{% endblock %}

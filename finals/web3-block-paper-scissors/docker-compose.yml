version: "3"
services:
  challenge:
    build:
      context: .
    command: sh -c "python3 -u challenge/proxy.py & python3 challenge/challenge.py"
    expose:
      - 12016
      - 12017
    ports:
      - "12016:12016"
      - "12017:12017"
    environment:
      - "PUBLIC_HOST=http://challs.polygl0ts.ch:12017"
